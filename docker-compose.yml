version: "3.8"

# =========================================================================
# 🛠️ SERVICE-ARCHITEKTUR: MAI_AI PLATTFORM
# =========================================================================
services:

  # -----------------------------------------------------------------------
  # FUNKTIONSBEREICH 1: REVERSE PROXY & INGRESS (Das Einfallstor)
  # Steuert das gesamte TLS/SSL-Routing, Zertifikate und Middleware
  # -----------------------------------------------------------------------
  traefik:
    image: traefik:v2.10
    container_name: traefik_gateway
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # DuckDNS & Let's Encrypt SSL-Konfiguration (auskommentiert für lokale Entwicklung)
      # - "--certificatesresolvers.myresolver.acme.dnschallenge=true"
      # - "--certificatesresolvers.myresolver.acme.dnschallenge.provider=duckdns"
      # - "--certificatesresolvers.myresolver.acme.email=${SSL_EMAIL}"
      # - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - "DUCKDNS_TOKEN=${DUCKDNS_TOKEN}"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - mai_ai_network
    labels:
      - "traefik.enable=true"
      
      # [Middleware] Vorbelegung der Google OAuth2-Validierung
      - "traefik.http.middlewares.oauth-auth.forwardauth.address=http://oauth2-proxy:4180"
      - "traefik.http.middlewares.oauth-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.oauth-auth.forwardauth.authResponseHeaders=X-Forwarded-User,X-Forwarded-Email,X-Forwarded-Access-Token"

      # [Router] Catch-All fängt unauthentifizierte Anfragen ab und zwingt zum OAuth2-Login
      - "traefik.http.routers.catchall.rule=Host(`platform.local`, `${DOMAIN_NAME}`)"
      - "traefik.http.routers.catchall.entrypoints=web"
      - "traefik.http.routers.catchall.middlewares=oauth-auth"
      - "traefik.http.routers.catchall.service=noop@internal"
      - "traefik.http.routers.catchall.priority=1"


  # -----------------------------------------------------------------------
  # FUNKTIONSBEREICH 2: SECURITY & IDENTITY PROVIDER (Die Zugriffskontrolle)
  # Kapselt die OAuth2-Authentifizierung über Google
  # -----------------------------------------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.4.0
    container_name: oauth2_proxy
    restart: always
    environment:
      OAUTH2_PROXY_PROVIDER: "google"
      OAUTH2_PROXY_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${COOKIE_SECRET}"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*" 
      OAUTH2_PROXY_UPSTREAMS: "file:///dev/null"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REDIRECT_URL: "http://platform.local/oauth2/callback" 
      # Für Live-Betrieb anpassen: "https://${DOMAIN_NAME}/oauth2/callback"
      OAUTH2_PROXY_COOKIE_SECURE: "false" 
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_COOKIE_DOMAINS: "platform.local,${DOMAIN_NAME}"
      OAUTH2_PROXY_WHITELIST_DOMAINS: "platform.local,${DOMAIN_NAME}"
    networks:
      - mai_ai_network
    labels:
      - "traefik.enable=true"
      # [Router] Ausnahmeregel: Der OAuth2-Callback darf die Authentifizierung umgehen
      - "traefik.http.routers.oauth2-proxy.rule=Host(`platform.local`, `${DOMAIN_NAME}`) && PathPrefix(`/oauth2`)"
      - "traefik.http.routers.oauth2-proxy.entrypoints=web"
      - "traefik.http.routers.oauth2-proxy.service=oauth2-proxy"
      - "traefik.http.routers.oauth2-proxy.priority=100"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"


  # -----------------------------------------------------------------------
  # FUNKTIONSBEREICH 3: CORE AI COMPUTING ENGINE (Das lokale LLM-System)
  # Isoliertes System für das Hosting lokaler Modelle via Ollama
  # -----------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: mai_ai_ollama_engine
    restart: always
    volumes:
      - mai_ai_local_models:/root/.ollama
      - mai_ai_config:/etc/ollama
    networks:
      - mai_ai_network


# =========================================================================
# INFRASTRUKTUR-KOPPLUNG (Schnittstellen zu den Notebook-Ressourcen)
# =========================================================================
networks:
  mai_ai_network:
    external: true
    name: mai-ai_network

volumes:
  mai_ai_local_models:
    external: true
  mai_ai_db_data:
    external: true
  mai_ai_config:
    external: true